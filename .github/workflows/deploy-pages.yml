name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable the pinned Yarn release
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build the Vite site
        run: yarn build

      - name: Publish the compiled userscript as release.user.js
        run: cp dist/userscript/uscardforum-style.user.js dist/release.user.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Vite output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
